name: Sentinella Butter Burger

on:
  schedule:
    - cron: "2-59/5 * * * *"   # ogni 5 minuti circa (GitHub a volte ritarda)
  workflow_dispatch:           # pulsante "Run workflow" per avviarla a mano

concurrency:
  group: sentinella
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Rome
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      EMAIL_AVVISI: ${{ secrets.EMAIL_AVVISI }}
    steps:
      - uses: actions/checkout@v4
      - name: Recupera cosa è già stato segnalato
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: stato.json
          key: stato-${{ github.run_id }}
          restore-keys: stato-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controlla i tavoli
        run: python butterburger_sentinella.py --una-volta
      - name: Salva lo stato
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: stato.json
          key: stato-${{ github.run_id }}
