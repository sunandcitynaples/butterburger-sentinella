name: Sentinella Butter Burger

# Ogni esecuzione controlla di continuo (ogni ~3 minuti) per circa 5 ore e mezza,
# poi fa partire da sola la successiva. L'orario "schedule" serve solo da riserva
# per riavviarla se la catena si interrompe.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sentinella
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      TZ: Europe/Rome
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - name: Recupera cosa è già stato segnalato
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: stato.json
          key: stato-${{ github.run_id }}
          restore-keys: stato-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controlla i tavoli
        id: check
        run: python -u butterburger_sentinella.py --per-minuti 330
      - name: Salva lo stato
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: stato.json
          key: stato-${{ github.run_id }}
      - name: Fai ripartire la sentinella
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sentinella.yml --ref "${{ github.ref_name }}"
